<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', sans-serif;">
  <text x="475" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">EVENT ATTENDANCE CONVERSION RATE</text>
  <text x="475" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">% of Registered Students Who Physically Attended (Reg No: 31)</text>

  <g transform="translate(260, 100)">
    <!-- Event 1: GenAI Workshop (100%) -->
    <text x="-20" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">Hands-on GenAI Workshop</text>
    <rect x="0" y="10" width="550" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="10" width="500" height="32" rx="6" fill="#10b981"/>
    <text x="515" y="32" fill="#34d399" font-size="14" font-weight="bold">100.0% (6/6)</text>

    <!-- Event 2: VIBES Cultural (88.9%) -->
    <text x="-20" y="87" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">VIBES 2026 Cultural Fest</text>
    <rect x="0" y="65" width="550" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="65" width="444" height="32" rx="6" fill="#059669"/>
    <text x="460" y="87" fill="#6ee7b7" font-size="14" font-weight="bold">88.9% (8/9)</text>

    <!-- Event 3: Cloud Seminar (80.0%) -->
    <text x="-20" y="142" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">Cloud &amp; Distributed Systems</text>
    <rect x="0" y="120" width="550" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="120" width="400" height="32" rx="6" fill="#0284c7"/>
    <text x="415" y="142" fill="#38bdf8" font-size="14" font-weight="bold">80.0% (4/5)</text>

    <!-- Event 4: CYBERFEST 2026 (77.8%) -->
    <text x="-20" y="197" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">CYBERFEST 2026 Symposium</text>
    <rect x="0" y="175" width="550" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="175" width="389" height="32" rx="6" fill="#3b82f6"/>
    <text x="405" y="197" fill="#93c5fd" font-size="14" font-weight="bold">77.8% (7/9)</text>

    <!-- Event 5: Embedded IoT (25.0%) -->
    <text x="-20" y="252" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">Embedded IoT &amp; Robotics</text>
    <rect x="0" y="230" width="550" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="230" width="125" height="32" rx="6" fill="#f59e0b"/>
    <text x="140" y="252" fill="#fcd34d" font-size="14" font-weight="bold">25.0% (1/4)</text>

    <!-- X Axis -->
    <line x1="0" y1="285" x2="550" y2="285" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="305" fill="#94a3b8" font-size="11">0%</text>
    <text x="125" y="305" fill="#94a3b8" font-size="11">25%</text>
    <text x="250" y="305" fill="#94a3b8" font-size="11">50%</text>
    <text x="375" y="305" fill="#94a3b8" font-size="11">75%</text>
    <text x="500" y="305" fill="#94a3b8" font-size="11">100% Turnout</text>
  </g>
