    <!-- Mech Dept -->
    <text x="-20" y="252" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">Mechanical Engineering</text>
    <rect x="0" y="230" width="560" height="32" rx="6" fill="#1e293b"/>
