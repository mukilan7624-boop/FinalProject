    <rect x="0" y="10" width="480" height="32" rx="6" fill="#0284c7"/>
    <text x="495" y="32" fill="#38bdf8" font-size="14" font-weight="bold">18 Registrations</text>

    <!-- CSE Dept -->
    <text x="-20" y="87" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">Computer Science &amp; Engg</text>
    <rect x="0" y="65" width="560" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="65" width="160" height="32" rx="6" fill="#2563eb"/>
    <text x="175" y="87" fill="#93c5fd" font-size="14" font-weight="bold">6 Registrations</text>

    <!-- ECE Dept -->
    <text x="-20" y="142" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="end">Electronics &amp; Comm Engg</text>
    <rect x="0" y="120" width="560" height="32" rx="6" fill="#1e293b"/>
    <rect x="0" y="120" width="133" height="32" rx="6" fill="#4f46e5"/>
