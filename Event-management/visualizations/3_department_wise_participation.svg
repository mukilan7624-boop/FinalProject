    <!-- X Axis -->
    <line x1="0" y1="285" x2="560" y2="285" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="305" fill="#94a3b8" font-size="11">0</text>
    <text x="133" y="305" fill="#94a3b8" font-size="11">5</text>
    <text x="266" y="305" fill="#94a3b8" font-size="11">10</text>
    <text x="400" y="305" fill="#94a3b8" font-size="11">15</text>
    <text x="533" y="305" fill="#94a3b8" font-size="11">20 Count</text>
