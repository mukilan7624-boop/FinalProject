<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', sans-serif;">
  <defs>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">AGILE INCREMENTAL PROCESS MODEL</text>
  <text x="480" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">Unit 1: Software Process &amp; Life Cycle Model | Course: 25ITT33 Software Engineering (Reg No: 31)</text>

  <!-- Step 1: Product Backlog -->
  <g transform="translate(40, 110)" filter="url(#pShadow)">
    <rect x="0" y="0" width="150" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="8" fill="#0284c7"/>
    <text x="75" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Product Backlog</text>
    <text x="15" y="60" fill="#e2e8f0" font-size="11">• Event CRUD</text>
    <text x="15" y="80" fill="#e2e8f0" font-size="11">• Duplicate Check</text>
    <text x="15" y="100" fill="#e2e8f0" font-size="11">• Capacity Limits</text>
    <text x="15" y="120" fill="#e2e8f0" font-size="11">• Attendance Log</text>
    <text x="15" y="140" fill="#e2e8f0" font-size="11">• Student Feedback</text>
    <text x="15" y="160" fill="#e2e8f0" font-size="11">• Python Analytics</text>
    <text x="15" y="180" fill="#e2e8f0" font-size="11">• Web Dashboard</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="190" y1="210" x2="230" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Sprint Planning & Sprints -->
  <g transform="translate(240, 110)" filter="url(#pShadow)">
    <rect x="0" y="0" width="460" height="200" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="36" rx="8" fill="#4338ca"/>
    <text x="230" y="24" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2-Week Sprint Execution Cycles</text>

    <!-- Sprint 1 -->
    <rect x="15" y="50" width="95" height="135" rx="6" fill="#312e81"/>
    <text x="62" y="72" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">Sprint 1</text>
    <line x1="25" y1="80" x2="100" y2="80" stroke="#4338ca"/>
    <text x="22" y="98" fill="#e2e8f0" font-size="10">SRS &amp; DB</text>
    <text x="22" y="115" fill="#e2e8f0" font-size="10">3NF Schema</text>
    <text x="22" y="132" fill="#e2e8f0" font-size="10">Seed Data</text>
    <text x="22" y="150" fill="#a5b4fc" font-size="9">✔ Done</text>

    <!-- Sprint 2 -->
    <rect x="125" y="50" width="95" height="135" rx="6" fill="#312e81"/>
    <text x="172" y="72" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">Sprint 2</text>
    <line x1="135" y1="80" x2="210" y2="80" stroke="#4338ca"/>
    <text x="132" y="98" fill="#e2e8f0" font-size="10">Java OOP</text>
    <text x="132" y="115" fill="#e2e8f0" font-size="10">Service Layer</text>
    <text x="132" y="132" fill="#e2e8f0" font-size="10">Exceptions</text>
    <text x="132" y="150" fill="#a5b4fc" font-size="9">✔ Done</text>

    <!-- Sprint 3 -->
    <rect x="235" y="50" width="95" height="135" rx="6" fill="#312e81"/>
    <text x="282" y="72" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">Sprint 3</text>
    <line x1="245" y1="80" x2="320" y2="80" stroke="#4338ca"/>
    <text x="242" y="98" fill="#e2e8f0" font-size="10">Python EDA</text>
    <text x="242" y="115" fill="#e2e8f0" font-size="10">Pandas/NumPy</text>
    <text x="242" y="132" fill="#e2e8f0" font-size="10">6 Visuals</text>
    <text x="242" y="150" fill="#a5b4fc" font-size="9">✔ Done</text>

    <!-- Sprint 4 -->
    <rect x="345" y="50" width="100" height="135" rx="6" fill="#312e81"/>
    <text x="395" y="72" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">Sprint 4</text>
    <line x1="355" y1="80" x2="435" y2="80" stroke="#4338ca"/>
    <text x="352" y="98" fill="#e2e8f0" font-size="10">White/Black Box</text>
    <text x="352" y="115" fill="#e2e8f0" font-size="10">Web Dashboard</text>
    <text x="352" y="132" fill="#e2e8f0" font-size="10">COCOMO / Git</text>
    <text x="352" y="150" fill="#a5b4fc" font-size="9">✔ Done</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="700" y1="210" x2="740" y2="210" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Working Increment Deliverables -->
  <g transform="translate(750, 110)" filter="url(#pShadow)">
    <rect x="0" y="0" width="170" height="200" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#059669"/>
    <text x="85" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Tested Increment</text>
    <text x="15" y="65" fill="#e2e8f0" font-size="11">✔ Java CLI Runner</text>
    <text x="15" y="90" fill="#e2e8f0" font-size="11">✔ SQLite / MySQL DB</text>
    <text x="15" y="115" fill="#e2e8f0" font-size="11">✔ Python EDA Charts</text>
    <text x="15" y="140" fill="#e2e8f0" font-size="11">✔ Localhost Web UI</text>
    <text x="15" y="165" fill="#e2e8f0" font-size="11">✔ Testing Doc (100%)</text>
    <text x="15" y="185" fill="#10b981" font-size="10" font-weight="bold">Ready for Deployment</text>
  </g>

  <!-- Feedback Loop Arrow (Sprint Review to Backlog) -->
  <path d="M 835 310 L 835 390 L 115 390 L 115 315" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="475" y="415" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Continuous Feedback, Sprint Retrospective &amp; Requirements Refinement Loop</text>
</svg>
