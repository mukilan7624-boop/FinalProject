<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="38" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">OVERALL SYSTEM ARCHITECTURE</text>
  <text x="475" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Multi-Tier Integrated Architecture | Reg No: 31 | VCET IT</text>

  <!-- Tier 1: Presentation Layer -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="830" height="95" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="30" fill="#38bdf8" font-size="14" font-weight="bold">TIER 1: PRESENTATION &amp; CLIENT LAYER</text>
    <rect x="30" y="45" width="360" height="36" rx="6" fill="#0284c7"/>
    <text x="210" y="68" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Administrator Console (Event CRUD, Attendance)</text>
    <rect x="440" y="45" width="360" height="36" rx="6" fill="#0284c7"/>
    <text x="620" y="68" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Student Self-Service Portal (Registration &amp; Feedback)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="475" y1="185" x2="475" y2="215" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="475,220 470,210 480,210" fill="#38bdf8"/>

  <!-- Tier 2: Business Logic & Application Layer -->
  <g transform="translate(60, 225)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="830" height="110" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="28" fill="#a5b4fc" font-size="14" font-weight="bold">TIER 2: JAVA APPLICATION &amp; BUSINESS LOGIC LAYER</text>
    <!-- Services -->
    <rect x="30" y="42" width="240" height="52" rx="6" fill="#4338ca"/>
    <text x="150" y="64" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EventService</text>
    <text x="150" y="82" fill="#c7d2fe" font-size="10" text-anchor="middle">Capacity &amp; Duplicate Checks</text>
    <rect x="295" y="42" width="240" height="52" rx="6" fill="#4338ca"/>
    <text x="415" y="64" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ReportService</text>
    <text x="415" y="82" fill="#c7d2fe" font-size="10" text-anchor="middle">Java Streams &amp; Aggregations</text>
    <rect x="560" y="42" width="240" height="52" rx="6" fill="#4338ca"/>
    <text x="680" y="64" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DAO Persistence Layer</text>
    <text x="680" y="82" fill="#c7d2fe" font-size="10" text-anchor="middle">JDBC PreparedStatements</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="475" y1="335" x2="475" y2="365" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="475,370 470,360 480,360" fill="#6366f1"/>

  <!-- Tier 3: Database & Storage Layer -->
  <g transform="translate(60, 375)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="830" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="28" fill="#6ee7b7" font-size="14" font-weight="bold">TIER 3: RELATIONAL DATABASE LAYER (SQLite 3 / MySQL)</text>
    <rect x="30" y="42" width="170" height="38" rx="6" fill="#065f46"/>
    <text x="115" y="66" fill="#ecfdf5" font-size="12" font-weight="bold" text-anchor="middle">events</text>
    <rect x="225" y="42" width="170" height="38" rx="6" fill="#065f46"/>
    <text x="310" y="66" fill="#ecfdf5" font-size="12" font-weight="bold" text-anchor="middle">students</text>
    <rect x="420" y="42" width="170" height="38" rx="6" fill="#065f46"/>
    <text x="505" y="66" fill="#ecfdf5" font-size="12" font-weight="bold" text-anchor="middle">registrations</text>
    <rect x="615" y="42" width="185" height="38" rx="6" fill="#065f46"/>
    <text x="707" y="66" fill="#ecfdf5" font-size="12" font-weight="bold" text-anchor="middle">attendance &amp; feedback</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="475" y1="470" x2="475" y2="495" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="475,500 470,490 480,490" fill="#10b981"/>

  <!-- Tier 4: Python Analytics & Visualization Pipeline -->
  <g transform="translate(60, 505)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="830" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="28" fill="#fcd34d" font-size="14" font-weight="bold">PYTHON DATA SCIENCE &amp; VISUALIZATION PIPELINE</text>
    <rect x="30" y="40" width="240" height="36" rx="6" fill="#b45309"/>
    <text x="150" y="63" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SQL Query Extraction (Pandas)</text>
    <rect x="295" y="40" width="240" height="36" rx="6" fill="#b45309"/>
    <text x="415" y="63" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Preprocessing &amp; Cleaning</text>
    <rect x="560" y="40" width="240" height="36" rx="6" fill="#b45309"/>
    <text x="680" y="63" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Matplotlib / Seaborn Visuals</text>
  </g>
</svg>
