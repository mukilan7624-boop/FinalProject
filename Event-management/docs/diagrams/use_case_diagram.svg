<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="gradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradActor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradUC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAnalyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="40" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">USE CASE DIAGRAM: College Event Management &amp; Analytics</text>
  <text x="475" y="65" fill="#94a3b8" font-size="14" text-anchor="middle">Velalar College of Engineering and Technology | Reg No: 31 (25IT3A&amp;B)</text>

  <!-- System Boundary -->
  <rect x="250" y="90" width="450" height="530" rx="15" fill="url(#gradBox)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="120" fill="#38bdf8" font-size="16" font-weight="bold">College Event Management System Boundary</text>

  <!-- Left Actor: Admin -->
  <g transform="translate(80, 150)">
    <circle cx="40" cy="20" r="16" fill="url(#gradActor)" stroke="#bae6fd" stroke-width="2"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#38bdf8" stroke-width="3"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#38bdf8" stroke-width="3"/>
    <line x1="40" y1="70" x2="25" y2="105" stroke="#38bdf8" stroke-width="3"/>
    <line x1="40" y1="70" x2="55" y2="105" stroke="#38bdf8" stroke-width="3"/>
    <text x="40" y="125" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Administrator /</text>
    <text x="40" y="142" fill="#94a3b8" font-size="12" text-anchor="middle">Event Organizer</text>
  </g>

  <!-- Left Actor: Student -->
  <g transform="translate(80, 380)">
    <circle cx="40" cy="20" r="16" fill="url(#gradActor)" stroke="#bae6fd" stroke-width="2"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#38bdf8" stroke-width="3"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#38bdf8" stroke-width="3"/>
    <line x1="40" y1="70" x2="25" y2="105" stroke="#38bdf8" stroke-width="3"/>
    <line x1="40" y1="70" x2="55" y2="105" stroke="#38bdf8" stroke-width="3"/>
    <text x="40" y="125" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Student</text>
    <text x="40" y="142" fill="#94a3b8" font-size="12" text-anchor="middle">(Participant)</text>
  </g>

  <!-- Right Actor: Python Analytics -->
  <g transform="translate(790, 270)">
    <circle cx="40" cy="20" r="16" fill="url(#gradAnalyst)" stroke="#6ee7b7" stroke-width="2"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#10b981" stroke-width="3"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#10b981" stroke-width="3"/>
    <line x1="40" y1="70" x2="25" y2="105" stroke="#10b981" stroke-width="3"/>
    <line x1="40" y1="70" x2="55" y2="105" stroke="#10b981" stroke-width="3"/>
    <text x="40" y="125" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Data Science Engine</text>
    <text x="40" y="142" fill="#94a3b8" font-size="12" text-anchor="middle">(Python / Pandas)</text>
  </g>

  <!-- Use Cases (Ovals) inside boundary -->
  <!-- UC1: Manage Events -->
  <ellipse cx="475" cy="160" rx="140" ry="24" fill="url(#gradUC)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-1: Create, Update &amp; Delete Events</text>

  <!-- UC2: View Events -->
  <ellipse cx="475" cy="225" rx="140" ry="24" fill="url(#gradUC)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="230" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-2: View Event Details &amp; Availability</text>

  <!-- UC3: Register for Event -->
  <ellipse cx="475" cy="290" rx="140" ry="24" fill="url(#gradUC)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="295" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-3: Register for Event</text>

  <!-- UC4: Capacity & Duplicate Check (Included) -->
  <ellipse cx="475" cy="355" rx="150" ry="24" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="475" y="360" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">&lt;&lt;include&gt;&gt; Validate Capacity &amp; Duplicates</text>

  <!-- UC5: Mark Attendance -->
  <ellipse cx="475" cy="420" rx="140" ry="24" fill="url(#gradUC)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="425" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-5: Record Attendance</text>

  <!-- UC6: Submit Feedback -->
  <ellipse cx="475" cy="485" rx="140" ry="24" fill="url(#gradUC)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="490" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-6: Submit Event Feedback &amp; Rating</text>

  <!-- UC7: Python Visualization -->
  <ellipse cx="475" cy="555" rx="145" ry="25" fill="url(#gradAnalyst)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="560" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-7: Data Retrieval &amp; Visual Analytics</text>

  <!-- Connectors -->
  <!-- Admin lines -->
  <line x1="140" y1="180" x2="335" y2="160" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="140" y1="190" x2="335" y2="225" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="140" y1="210" x2="335" y2="420" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Student lines -->
  <line x1="140" y1="410" x2="335" y2="230" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="140" y1="420" x2="335" y2="290" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="140" y1="435" x2="335" y2="485" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- UC3 to UC4 include -->
  <line x1="475" y1="314" x2="475" y2="331" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3"/>
  <polygon points="475,331 471,324 479,324" fill="#f59e0b"/>

  <!-- Analyst lines -->
  <line x1="790" y1="320" x2="620" y2="555" stroke="#34d399" stroke-width="1.8"/>
</svg>
