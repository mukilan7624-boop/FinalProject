<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', sans-serif;">
  <defs>
    <filter id="compShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="38" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">UML COMPONENT DIAGRAM</text>
  <text x="500" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Unit 3: Component-Level Design | Course: 25ITT33 Software Engineering (Reg No: 31)</text>

  <!-- Component 1: UI / Presentation Component -->
  <g transform="translate(60, 110)" filter="url(#compShadow)">
    <rect x="0" y="0" width="260" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-10" y="20" width="22" height="12" fill="#0284c7" stroke="#38bdf8"/>
    <rect x="-10" y="45" width="22" height="12" fill="#0284c7" stroke="#38bdf8"/>
    <text x="130" y="30" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Presentation Component</text>
    <line x1="20" y1="70" x2="240" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="25" y="92" fill="#94a3b8" font-size="12">• Main.java (Console Menu)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="12">• Web Dashboard (HTML/JS)</text>
    <text x="25" y="132" fill="#94a3b8" font-size="12">• Terminal Table Viewer</text>
  </g>

  <!-- Interface: IEventManagementService -->
  <circle cx="410" cy="185" r="12" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <text x="410" y="155" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle">IEventService</text>
  <line x1="320" y1="185" x2="398" y2="185" stroke="#38bdf8" stroke-width="2"/>

  <!-- Component 2: Business Logic / Service Component -->
  <g transform="translate(500, 110)" filter="url(#compShadow)">
    <rect x="0" y="0" width="280" height="170" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect x="-10" y="20" width="22" height="12" fill="#4338ca" stroke="#818cf8"/>
    <rect x="-10" y="45" width="22" height="12" fill="#4338ca" stroke="#818cf8"/>
    <text x="140" y="30" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="140" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Business Service Component</text>
    <line x1="20" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="25" y="92" fill="#94a3b8" font-size="12">• EventService (Validation)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="12">• Capacity Limit Enforcer</text>
    <text x="25" y="132" fill="#94a3b8" font-size="12">• Duplicate Prevention Logic</text>
    <text x="25" y="152" fill="#94a3b8" font-size="12">• ReportService (Java Streams)</text>
  </g>

  <!-- Socket connecting IEventService to Service -->
  <path d="M 422 185 A 12 12 0 0 1 434 185" fill="none" stroke="#818cf8" stroke-width="2.5"/>
  <line x1="434" y1="185" x2="500" y2="185" stroke="#818cf8" stroke-width="2"/>

  <!-- Interface: IDAOAccess (between Service and Persistence) -->
  <circle cx="640" cy="350" r="12" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
  <text x="700" y="355" fill="#6ee7b7" font-size="11" font-weight="bold">IPersistenceDAO</text>
  <line x1="640" y1="280" x2="640" y2="338" stroke="#818cf8" stroke-width="2"/>

  <!-- Component 3: Data Access Object (DAO) Persistence Component -->
  <g transform="translate(500, 420)" filter="url(#compShadow)">
    <rect x="0" y="0" width="280" height="170" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="-10" y="20" width="22" height="12" fill="#065f46" stroke="#10b981"/>
    <rect x="-10" y="45" width="22" height="12" fill="#065f46" stroke="#10b981"/>
    <text x="140" y="30" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="140" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Data Access Layer (DAO)</text>
    <line x1="20" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="25" y="92" fill="#94a3b8" font-size="12">• EventDAO.java</text>
    <text x="25" y="112" fill="#94a3b8" font-size="12">• RegistrationDAO.java</text>
    <text x="25" y="132" fill="#94a3b8" font-size="12">• DBConnection (JDBC/Driver)</text>
    <text x="25" y="152" fill="#94a3b8" font-size="12">• DataStore (In-Memory Sync)</text>
  </g>

  <!-- Socket between DAO and Service -->
  <path d="M 640 362 A 12 12 0 0 1 640 374" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <line x1="640" y1="374" x2="640" y2="420" stroke="#10b981" stroke-width="2"/>

  <!-- Component 4: Relational Database Storage Component -->
  <g transform="translate(80, 420)" filter="url(#compShadow)">
    <rect x="0" y="0" width="260" height="160" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-10" y="20" width="22" height="12" fill="#b45309" stroke="#f59e0b"/>
    <rect x="-10" y="45" width="22" height="12" fill="#b45309" stroke="#f59e0b"/>
    <text x="130" y="30" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Relational Database</text>
    <line x1="20" y1="70" x2="240" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="25" y="92" fill="#94a3b8" font-size="12">• SQLite 3 / MySQL DB</text>
    <text x="25" y="112" fill="#94a3b8" font-size="12">• events &amp; students tables</text>
    <text x="25" y="132" fill="#94a3b8" font-size="12">• registrations &amp; attendance</text>
    <text x="25" y="152" fill="#94a3b8" font-size="12">• feedback table (BCNF)</text>
  </g>

  <!-- Connection: DAO to Database (SQL Transactions) -->
  <line x1="500" y1="500" x2="340" y2="500" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="340,500 350,495 350,505" fill="#10b981"/>
  <text x="420" y="490" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">SQL Queries</text>

  <!-- Component 5: Python Data Science & Analytics Component -->
  <g transform="translate(80, 270)" filter="url(#compShadow)">
    <rect x="0" y="0" width="260" height="120" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect x="-10" y="20" width="22" height="12" fill="#be185d" stroke="#ec4899"/>
    <rect x="-10" y="45" width="22" height="12" fill="#be185d" stroke="#ec4899"/>
    <text x="130" y="26" fill="#ec4899" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="48" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Python Analytics Engine</text>
    <line x1="20" y1="58" x2="240" y2="58" stroke="#334155" stroke-width="1"/>
    <text x="25" y="78" fill="#94a3b8" font-size="11">• Pandas / NumPy Wrangling</text>
    <text x="25" y="96" fill="#94a3b8" font-size="11">• Matplotlib &amp; Seaborn Charts</text>
    <text x="25" y="112" fill="#94a3b8" font-size="11">• Jupyter Notebook EDA</text>
  </g>

  <!-- SQL Retrieval line to Python Engine -->
  <line x1="210" y1="420" x2="210" y2="390" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="210,390 206,400 214,400" fill="#ec4899"/>
  <text x="250" y="410" fill="#f472b6" font-size="10">read_sql()</text>
</svg>
