<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', sans-serif;">
  <text x="475" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">STUDENT FEEDBACK &amp; RATING DISTRIBUTION</text>
  <text x="475" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">Post-Event Satisfaction Metrics (Mean: 4.48 ★) | Reg No: 31</text>

  <!-- Left: Rating Frequency Histogram -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="360" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15" font-weight="bold">Star Rating Frequency (N=25)</text>

    <!-- 5 Stars (14 counts) -->
    <text x="30" y="80" fill="#facc15" font-size="13" font-weight="bold">★★★★★ (5 Stars)</text>
    <rect x="30" y="90" width="280" height="24" rx="4" fill="#334155"/>
    <rect x="30" y="90" width="224" height="24" rx="4" fill="#eab308"/>
    <text x="265" y="107" fill="#fef08a" font-size="12" font-weight="bold">14 (56%)</text>

    <!-- 4 Stars (9 counts) -->
    <text x="30" y="145" fill="#facc15" font-size="13" font-weight="bold">★★★★☆ (4 Stars)</text>
    <rect x="30" y="155" width="280" height="24" rx="4" fill="#334155"/>
    <rect x="30" y="155" width="144" height="24" rx="4" fill="#ca8a04"/>
    <text x="185" y="172" fill="#fef08a" font-size="12" font-weight="bold">9 (36%)</text>

    <!-- 3 Stars (2 counts) -->
    <text x="30" y="210" fill="#facc15" font-size="13" font-weight="bold">★★★☆☆ (3 Stars)</text>
    <rect x="30" y="220" width="280" height="24" rx="4" fill="#334155"/>
    <rect x="30" y="220" width="32" height="24" rx="4" fill="#a16207"/>
    <text x="72" y="237" fill="#fef08a" font-size="12" font-weight="bold">2 (8%)</text>

    <!-- 2 and 1 Stars (0 counts) -->
    <text x="30" y="275" fill="#94a3b8" font-size="13">★★☆☆☆ / ★☆☆☆☆</text>
    <rect x="30" y="285" width="280" height="12" rx="4" fill="#334155"/>
    <text x="40" y="295" fill="#64748b" font-size="10">0 (0%) - High Quality Delivery</text>
  </g>

  <!-- Right: Category Mean Rating Box Plot / Summary -->
  <g transform="translate(500, 110)">
    <rect x="0" y="0" width="360" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15" font-weight="bold">Average Rating by Category</text>

    <!-- Workshop -->
    <text x="30" y="80" fill="#e2e8f0" font-size="13">Workshops</text>
    <text x="330" y="80" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">4.71 ★</text>
    <rect x="30" y="90" width="290" height="18" rx="4" fill="#334155"/>
    <rect x="30" y="90" width="273" height="18" rx="4" fill="#38bdf8"/>

    <!-- Cultural -->
    <text x="30" y="145" fill="#e2e8f0" font-size="13">Cultural Events</text>
    <text x="330" y="145" fill="#ec4899" font-size="13" font-weight="bold" text-anchor="end">4.63 ★</text>
    <rect x="30" y="155" width="290" height="18" rx="4" fill="#334155"/>
    <rect x="30" y="155" width="268" height="18" rx="4" fill="#ec4899"/>

    <!-- Symposium -->
    <text x="30" y="210" fill="#e2e8f0" font-size="13">Technical Symposiums</text>
    <text x="330" y="210" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="end">4.29 ★</text>
    <rect x="30" y="220" width="290" height="18" rx="4" fill="#334155"/>
    <rect x="30" y="220" width="248" height="18" rx="4" fill="#818cf8"/>

    <!-- Seminar -->
    <text x="30" y="275" fill="#e2e8f0" font-size="13">National Seminars</text>
    <text x="330" y="275" fill="#10b981" font-size="13" font-weight="bold" text-anchor="end">3.75 ★</text>
    <rect x="30" y="285" width="290" height="18" rx="4" fill="#334155"/>
    <rect x="30" y="285" width="217" height="18" rx="4" fill="#10b981"/>
  </g>
</svg>
